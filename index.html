<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terrace house model</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #14161a; color: #e8e6e1;
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 10px 14px; font-size: 15px; font-weight: 500; }
  header span { color: #9a9790; font-weight: 400; margin-left: 8px; font-size: 13px; }
  model-viewer { width: 100%; height: calc(100% - 44px); background: #14161a; }
</style>
</head>
<body>
<header>Terrace house <span>drag to orbit, two fingers to pan, pinch to zoom</span></header>
<model-viewer
  src="house_web.glb"
  alt="3D model of the terrace house"
  camera-controls
  touch-action="none"
  auto-rotate
  auto-rotate-delay="1500"
  rotation-per-second="8deg"
  interaction-prompt="none"
  shadow-intensity="0.85"
  shadow-softness="0.7"
  exposure="1.25"
  tone-mapping="neutral"
  environment-image="neutral"
  camera-orbit="40deg 58deg auto"
  max-camera-orbit="auto 92deg auto">
</model-viewer>
</body>
</html>
