<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terrace house model</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #14161a; color: #e8e6e1;
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 14px;
           font-size: 15px; font-weight: 500; }
  header span { color: #9a9790; font-weight: 400; font-size: 13px; }
  .swatches { display: flex; gap: 8px; margin-left: auto; }
  .swatches button { font: inherit; font-size: 13px; color: #e8e6e1; background: #23262c;
                     border: 1px solid #343840; border-radius: 999px; padding: 5px 13px; cursor: pointer; }
  .swatches button[aria-pressed="true"] { border-color: #c08a3e; color: #f3d9b5; }
  .swatches button:focus-visible { outline: 2px solid #c08a3e; outline-offset: 2px; }
  model-viewer { width: 100%; height: calc(100% - 52px); background: #14161a; }
</style>
</head>
<body>
<header>Terrace house <span>drag to orbit, two fingers to pan, pinch to zoom</span>
  <span class="swatches" role="group" aria-label="Wall colour">
    <button type="button" data-src="house_web.glb" aria-pressed="true">Greige</button>
    <button type="button" data-src="house_web_green.glb" aria-pressed="false">Sage</button>
    <button type="button" data-src="house_web_blue.glb" aria-pressed="false">Blue</button>
  </span>
</header>
<model-viewer
  src="house_web.glb"
  alt="3D model of the terrace house"
  camera-controls
  touch-action="none"
  auto-rotate
  auto-rotate-delay="1500"
  rotation-per-second="8deg"
  interaction-prompt="none"
  shadow-intensity="0.9"
  shadow-softness="0.8"
  exposure="1.0"
  tone-mapping="commerce"
  environment-image="neutral"
  camera-orbit="40deg 58deg auto"
  max-camera-orbit="auto 92deg auto">
</model-viewer>
<script>
  const viewer = document.querySelector('model-viewer');
  document.querySelectorAll('.swatches button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.swatches button')
        .forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
      viewer.src = btn.dataset.src;
    });
  });
</script>
</body>
</html>
